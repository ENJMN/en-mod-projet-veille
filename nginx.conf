# Configuration Nginx pour ways-ci.com
# Emplacement sur le VPS : /etc/nginx/sites-available/ways-ci
# Activer avec : ln -s /etc/nginx/sites-available/ways-ci /etc/nginx/sites-enabled/

server {
    listen 80;
    server_name ways-ci.com www.ways-ci.com;

    # Redirection HTTP → HTTPS (activée après installation du certificat SSL)
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    server_name ways-ci.com www.ways-ci.com;

    # Certificats SSL — générés par Certbot (Let's Encrypt)
    ssl_certificate /etc/letsencrypt/live/ways-ci.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/ways-ci.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;

    # Taille max des uploads
    client_max_body_size 10M;

    # Proxy vers l'application Next.js (port 3000)
    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
    }

    # Cache des fichiers statiques Next.js
    location /_next/static/ {
        proxy_pass http://127.0.0.1:3000;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # Cache des fichiers publics (images, logos...)
    location /public/ {
        proxy_pass http://127.0.0.1:3000;
        add_header Cache-Control "public, max-age=86400";
    }

    # Logs
    access_log /var/log/nginx/ways-ci.access.log;
    error_log /var/log/nginx/ways-ci.error.log;
}
